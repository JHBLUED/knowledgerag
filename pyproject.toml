[project]
name = "knowledgerag"
version = "0.1.0"
description = "企业知识库问答服务（KnowledgeRAG）—— 旗舰项目一"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
