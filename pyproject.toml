[project]
name = "knowledgerag"
version = "0.1.0"
description = "企业知识库问答服务（KnowledgeRAG）—— 旗舰项目一"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "openai>=3.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# jieba 内部用了老式正则，在 Python 3.12+ 会抛 SyntaxWarning。
# 这是第三方库的问题，不影响功能，这里静音以保持测试日志干净。
filterwarnings = [
    "ignore::SyntaxWarning",
]
